# Home Assistant side of the Note 4C display.
#
# Everything here can be managed in the Home Assistant UI, so it's easy to change and to update.
# homeassistant/install.py creates or updates all of it through Home Assistant's API (see the
# README). The file is also a valid package, if you'd rather keep it in YAML, but use one or the
# other: the same entities can't be defined in both places.
#
# Besides what's below, it needs a local To-do list named "Note4C" (todo.note4c), which holds the
# notices, and Home Assistant's sun integration. Set your own entities under "variables" in the
# screen data automation. When the automation already exists, install.py keeps its variables.
#
# The device only reads from Home Assistant, so it doesn't need permission to perform actions. To
# dismiss a notice it reports the notice's key in its "Dismissed notice" sensor, and the
# automation note4c_notice_dismissed removes it from the list.
#
# To show a notice on the screen, call the script from any automation:
#
#   - action: script.note4c_notify
#     data:
#       title: Pralka skończyła pranie
#       message: Pranie czeka w pralce.
#       notice_id: pralka  # Optional. A new notice with the same id replaces the old one.
#       priority: high     # Optional. High-priority notices take the whole screen.
#
# Or add an item to the Note4C to-do list by hand: its name is the title and its description the
# message. A name starting with "!" makes it high priority. The script stores a notice_id as a last
# line of the description, such as "#pralka". To remove a notice, call script.note4c_clear with its
# notice_id, or with none to clear all, or delete or check off the item.

input_text:
  note4c_screen:
    name: Note4C screen
    min: 0
    max: 255
    icon: mdi:tablet
  # The notice the device shows: "key|count|priority|title|message", or empty when there's none.
  note4c_notice:
    name: Note4C notice
    min: 0
    max: 255
    icon: mdi:bell

script:
  note4c_notify:
    alias: Note 4C notify
    description: Shows a notice on the Note 4C on its next wake.
    mode: queued
    fields:
      title:
        description: Shown in bold.
        required: true
        selector:
          text:
      message:
        description: Up to two lines on the normal card, or about five on a high-priority notice.
        selector:
          text:
            multiline: true
      notice_id:
        description: Optional. A new notice with the same id replaces the old one.
        selector:
          text:
      priority:
        description: High takes the whole screen.
        default: normal
        selector:
          select:
            options: [normal, high]
    sequence:
      - variables:
          tag: "{{ notice_id | default('', true) | string | trim }}"
      - if:
          - condition: template
            value_template: "{{ tag != '' }}"
        then:
          - action: script.note4c_clear
            data:
              notice_id: "{{ tag }}"
      - action: todo.add_item
        target:
          entity_id: todo.note4c
        data:
          item: >-
            {{ ('! ' if priority | default('normal') == 'high' else '')
               ~ (title | default('', true) | string | trim or 'Powiadomienie') }}
          description: >-
            {{ message | default('', true) | string | trim }}{{ ('\n#' ~ tag) if tag else '' }}

  note4c_clear:
    alias: Note 4C clear notice
    description: Removes a notice by its id, or all notices when no id is given.
    mode: queued
    fields:
      notice_id:
        description: Leave empty to clear all.
        selector:
          text:
    sequence:
      - action: todo.get_items
        target:
          entity_id: todo.note4c
        data:
          status: needs_action
        response_variable: todo
      - variables:
          tag: "{{ notice_id | default('', true) | string | trim }}"
          uids: >-
            {%- set ns = namespace(uids=[]) -%}
            {%- for item in todo['todo.note4c']['items'] -%}
              {%- if tag == '' or (item.description | default('', true)).split('\n')[-1] == '#' ~ tag -%}
                {%- set ns.uids = ns.uids + [item.uid] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.uids }}
      - if:
          - condition: template
            value_template: "{{ uids | count > 0 }}"
        then:
          - action: todo.remove_item
            target:
              entity_id: todo.note4c
            data:
              item: "{{ uids }}"

automation:
  - id: note4c_screen_data
    alias: Note 4C screen data
    description: Prepares the data shown on the Zectrix Note 4C, which reads it when it wakes.
    mode: single
    variables:
      outdoor: sensor.outdoor_temperature # The temperature shown large on the screen.
      weather: weather.home # Any weather entity with an hourly forecast.
    triggers:
      - trigger: time_pattern
        minutes: "/10"
      - trigger: homeassistant
        event: start
    actions:
      - action: weather.get_forecasts
        target:
          entity_id: "{{ weather }}"
        data:
          type: hourly
        response_variable: response
      # Format: timestamp@temp|condition|night|high|low;hour,condition,night,temp;...
      # The timestamp lets the device warn when this automation has stopped running.
      # High and low cover the next 24 hours. Night comes from sun.sun, because most weather
      # conditions don't say whether it's day or night.
      - action: input_text.set_value
        target:
          entity_id: input_text.note4c_screen
        data:
          value: >-
            {%- set f = response[weather]['forecast'] -%}
            {%- set r = as_datetime(state_attr('sun.sun', 'next_rising')) -%}
            {%- set s = as_datetime(state_attr('sun.sun', 'next_setting')) -%}
            {%- set ns = namespace(hours='', count=0) -%}
            {#- The next 7 hours that haven't started yet. Weather integrations differ on whether
                the forecast begins with the current hour. -#}
            {%- for x in f -%}
              {%- set t = as_datetime(x.datetime) -%}
              {%- if t > now() and ns.count < 7 -%}
                {%- set day = (r <= t < s) if r < s else (t < s or t >= r) -%}
                {%- set ns.hours = ns.hours ~ ';' ~ as_local(t).hour ~ ',' ~ x.condition ~ ',' ~ (0 if day else 1) ~ ',' ~ (x.temperature | round(0) | int) -%}
                {%- set ns.count = ns.count + 1 -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set temps = f[:24] | map(attribute='temperature') | list -%}
            {#- The shown temperature only changes once the real one is a full degree away, so a
                value hovering near a rounding boundary doesn't redraw the screen on every wake. -#}
            {%- set raw = (states(outdoor) | float) if has_value(outdoor) else none -%}
            {%- set shown = states('input_text.note4c_screen').split('@')[-1].split('|')[0] | int(none) -%}
            {%- set outdoor_text = '?' if raw is none else (shown if shown is not none and (raw - shown) | abs < 1 else raw | round(0) | int) -%}
            {{ now().timestamp() | int }}@{{ outdoor_text }}|{{ states(weather) }}|{{ 1 if is_state('sun.sun', 'below_horizon') else 0 }}|{{ temps | max | round(0) | int }}|{{ temps | min | round(0) | int }}{{ ns.hours }}

  # Picks the notice to show: high priority first, then the newest, which is the last in the list.
  # Its key is the start of the item's uid, so a dismissal can't remove a later notice that reuses
  # the same id. Runs whenever the list changes, and every 5 minutes to catch edited items.
  - id: note4c_notices
    alias: Note 4C notices
    description: Writes the notice for the Note 4C, from its to-do list.
    mode: queued
    triggers:
      - trigger: state
        entity_id: todo.note4c
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
    actions:
      - action: todo.get_items
        target:
          entity_id: todo.note4c
        data:
          status: needs_action
        response_variable: todo
      - action: input_text.set_value
        target:
          entity_id: input_text.note4c_notice
        data:
          value: >-
            {#- Keeps only characters the device's fonts have, and keeps "|" for the separators.
                Keep "allowed" in step with text_glyphs in esphome/note4c.yaml. -#}
            {%- macro clean(text) -%}
              {%- set allowed = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZąćęłńóśźżĄĆĘŁŃÓŚŹŻ 0123456789.,:;!?-–()%/"+°…·' ~ "'" -%}
              {%- set text = text | replace('\n', ' ') | replace('|', '/') | replace('„', '"') | replace('”', '"')
                  | replace('“', '"') | replace('‘', "'") | replace('’', "'") | replace('—', '–') -%}
              {%- set ns = namespace(out='') -%}
              {%- for ch in text if ch in allowed -%}{%- set ns.out = ns.out ~ ch -%}{%- endfor -%}
              {{- ns.out | regex_replace('\\s+', ' ') | trim -}}
            {%- endmacro -%}
            {%- macro fit(text, limit) -%}
              {{- text if text | length <= limit else text[:limit - 1] ~ '…' -}}
            {%- endmacro -%}
            {%- set items = todo['todo.note4c']['items'] -%}
            {%- set newest = items | reverse | list -%}
            {%- set high = newest | selectattr('summary', 'match', '\\s*!') | list -%}
            {%- set top = (high + newest) | first | default(none) -%}
            {%- if top -%}
              {%- set lines = (top.description | default('', true)).split('\n') -%}
              {%- set message = (lines[:-1] if lines[-1].startswith('#') else lines) | join(' ') -%}
              {%- set head = (top.uid | replace('-', ''))[:12] ~ '|' ~ items | count ~ '|' ~ (1 if top in high else 0) ~ '|' -%}
              {%- set title = fit(clean(top.summary | regex_replace('^\\s*!\\s*', '')), 60) -%}
              {#- The helper holds 255 characters, so the message gets what's left. -#}
              {{ head }}{{ title }}|{{ fit(clean(message), 254 - (head ~ title) | length) }}
            {%- endif -%}

  # The device reports the key of each notice dismissed with its buttons. The same key can arrive
  # again later, such as after the device was offline, and then there's nothing left to remove.
  - id: note4c_notice_dismissed
    alias: Note 4C notice dismissed
    description: Removes the notice dismissed on the Note 4C, including a mirrored HA notification.
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.note4c_dismissed_notice # The device's "Dismissed notice" sensor.
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.state not in ['', 'unknown', 'unavailable'] }}"
    actions:
      - action: todo.get_items
        target:
          entity_id: todo.note4c
        data:
          status: needs_action
        response_variable: todo
      - variables:
          item: >-
            {%- set ns = namespace(item=none) -%}
            {%- for item in todo['todo.note4c']['items'] -%}
              {%- if (item.uid | replace('-', ''))[:12] == trigger.to_state.state -%}
                {%- set ns.item = item -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.item }}
      - condition: template
        value_template: "{{ item is mapping }}"
      - action: todo.remove_item
        target:
          entity_id: todo.note4c
        data:
          item: "{{ item.uid }}"
      - variables:
          tag: "{{ (item.description | default('', true)).split('\n')[-1] }}"
      - if:
          - condition: template
            value_template: "{{ tag.startswith('#ha:') }}"
        then:
          - action: persistent_notification.dismiss
            data:
              notification_id: "{{ tag[4:] }}"

  # Shows Home Assistant's own notifications too, the ones under Notifications in the sidebar.
  # install.py creates it turned off, because integrations post some of these, such as "New devices
  # discovered". Turn it on to use it. Dismissing a notification on either side removes it from both.
  - id: note4c_mirror_ha_notifications
    alias: Note 4C mirror HA notifications
    description: Copies Home Assistant notifications to the Note 4C. Turn it on to use it.
    mode: queued
    triggers:
      - trigger: persistent_notification
        update_type: [added, updated]
        id: added
      - trigger: persistent_notification
        update_type: [removed]
        id: removed
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: added
            sequence:
              - action: script.note4c_notify
                data:
                  notice_id: "ha:{{ trigger.notification.notification_id }}"
                  title: "{{ trigger.notification.title or 'Home Assistant' }}"
                  # Keeps a Markdown link's text and drops its address.
                  message: >-
                    {{ trigger.notification.message | regex_replace('\\[([^\\]]*)\\]\\([^)]*\\)', '\\1') }}
          - conditions:
              - condition: trigger
                id: removed
            sequence:
              - action: script.note4c_clear
                data:
                  notice_id: "ha:{{ trigger.notification.notification_id }}"
