# Home Assistant side of the Note 4C display, as a package.
#
# To install, put this file in your packages folder (see "Packages" in the Home Assistant docs) and
# restart. Or create the helpers, sensor, scripts and automations by hand in the UI, using the same
# values.
#
# Set your own entities under "variables" below. Requires Home Assistant's sun integration.
#
# The device only reads from Home Assistant, so it doesn't need permission to perform actions. To
# dismiss a notice it reports the notice's key in its "Dismissed notice" sensor, and the automation
# below does the rest.
#
# To show a notice on the screen, call the script from any automation:
#
#   - action: script.note4c_notify
#     data:
#       title: Pralka skończyła pranie
#       message: Pranie czeka w pralce.
#       notice_id: pralka  # Optional. A new notice with the same id replaces the old one.
#       priority: high     # Optional. High-priority notices take the whole screen.
#
# The device shows it on its next wake, so allow up to one wake interval (15 minutes by default).
# To remove a notice yourself, call script.note4c_clear with its notice_id, or with none to clear all.

input_text:
  note4c_screen:
    name: Note4C screen
    min: 0
    max: 255
    icon: mdi:tablet

input_boolean:
  # Also shows Home Assistant's own notifications, the ones under Notifications in the sidebar.
  # Integrations post some of these, such as "New devices discovered".
  note4c_show_ha_notifications:
    name: Note4C shows HA notifications
    icon: mdi:bell-badge

# The notice queue, newest first, kept in an attribute. "screen" is the compact form the device
# reads: "key|count|priority|title|message". Each notice gets a new key whenever it's added, so a
# dismissal can't remove a later notice that reuses the same id.
template:
  - triggers:
      - trigger: event
        event_type: note4c_notice_add
        id: add
      - trigger: event
        event_type: note4c_notice_remove
        id: remove
      # Sets the attributes on first start. Afterwards they're restored on restarts.
      - trigger: homeassistant
        event: start
        id: start
      - trigger: event
        event_type: event_template_reloaded
        id: start
    actions:
      - variables:
          old: "{{ state_attr('sensor.note4c_notices', 'queue') or [] }}"
          queue: >-
            {%- set d = trigger.event.data if trigger.id in ['add', 'remove'] else {} -%}
            {%- if trigger.id == 'add' -%}
              {%- set key = (now().timestamp() * 1000) | int | string -%}
              {%- set nid = (d.id | default('', true) | string) or key -%}
              {%- set item = {'id': nid, 'key': key, 'title': d.title | default('', true) | string,
                              'message': d.message | default('', true) | string,
                              'priority': 'high' if d.priority | default('') == 'high' else 'normal',
                              'source': d.source | default('script', true)} -%}
              {{ ([item] + (old | rejectattr('id', 'eq', nid) | list))[:10] }}
            {%- elif trigger.id == 'remove' and d.all | default(false) -%}
              {{ [] }}
            {%- elif trigger.id == 'remove' -%}
              {#- Event data turns numeric strings into numbers, so both sides are compared as text. -#}
              {%- set key = d.key | default('', true) | string -%}
              {%- set nid = d.id | default('', true) | string -%}
              {{ old | rejectattr('key', 'eq', key) | rejectattr('id', 'eq', nid) | list }}
            {%- else -%}
              {{ old }}
            {%- endif -%}
    sensor:
      - name: Note4C notices
        unique_id: note4c_notices
        icon: mdi:bell
        state: "{{ queue | count }}"
        attributes:
          queue: "{{ queue }}"
          screen: >-
            {#- Keeps only characters the device's fonts have, and keeps "|" for the separators.
                Keep "allowed" in step with text_glyphs in esphome/note4c.yaml. -#}
            {%- macro clean(text, limit) -%}
              {%- set allowed = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZąćęłńóśźżĄĆĘŁŃÓŚŹŻ 0123456789.,:;!?-–()%/"+°…·' ~ "'" -%}
              {%- set text = text | replace('\n', ' ') | replace('|', '/') | replace('„', '"') | replace('”', '"')
                  | replace('“', '"') | replace('‘', "'") | replace('’', "'") | replace('—', '–') -%}
              {%- set ns = namespace(out='') -%}
              {%- for ch in text if ch in allowed -%}{%- set ns.out = ns.out ~ ch -%}{%- endfor -%}
              {%- set out = ns.out | regex_replace('\\s+', ' ') | trim -%}
              {{- out if out | length <= limit else out[:limit - 1] ~ '…' -}}
            {%- endmacro -%}
            {%- set high = queue | selectattr('priority', 'eq', 'high') | list -%}
            {%- set top = (high + queue) | first | default(none) -%}
            {%- if top -%}
              {{ top.key }}|{{ queue | count }}|{{ 1 if top.priority == 'high' else 0 }}|{{ clean(top.title, 60) }}|{{ clean(top.message, 240) }}
            {%- endif -%}

script:
  note4c_notify:
    alias: Note 4C notify
    description: Shows a notice on the Note 4C on its next wake.
    mode: queued
    fields:
      title:
        description: Shown in bold.
        required: true
        selector:
          text:
      message:
        description: Up to two lines on the normal card, or about five on a high-priority notice.
        selector:
          text:
            multiline: true
      notice_id:
        description: Optional. A new notice with the same id replaces the old one.
        selector:
          text:
      priority:
        description: High takes the whole screen.
        default: normal
        selector:
          select:
            options: [normal, high]
    sequence:
      - event: note4c_notice_add
        event_data:
          title: "{{ title | default('') }}"
          message: "{{ message | default('') }}"
          id: "{{ notice_id | default('') }}"
          priority: "{{ priority | default('normal') }}"

  note4c_clear:
    alias: Note 4C clear notice
    description: Removes a notice by its id, or all notices when no id is given.
    mode: queued
    fields:
      notice_id:
        description: Leave empty to clear all.
        selector:
          text:
    sequence:
      - event: note4c_notice_remove
        event_data:
          id: "{{ notice_id | default('') }}"
          all: "{{ notice_id | default('') == '' }}"

automation:
  - id: note4c_screen_data
    alias: Note 4C screen data
    description: Prepares the data shown on the Zectrix Note 4C, which reads it when it wakes.
    mode: single
    variables:
      outdoor: sensor.outdoor_temperature # The temperature shown large on the screen.
      weather: weather.home # Any weather entity with an hourly forecast.
    triggers:
      - trigger: time_pattern
        minutes: "/10"
      - trigger: homeassistant
        event: start
    actions:
      - action: weather.get_forecasts
        target:
          entity_id: "{{ weather }}"
        data:
          type: hourly
        response_variable: response
      # Format: timestamp@temp|condition|night|high|low;hour,condition,night,temp;...
      # The timestamp lets the device warn when this automation has stopped running.
      # High and low cover the next 24 hours. Night comes from sun.sun, because most weather
      # conditions don't say whether it's day or night.
      - action: input_text.set_value
        target:
          entity_id: input_text.note4c_screen
        data:
          value: >-
            {%- set f = response[weather]['forecast'] -%}
            {%- set r = as_datetime(state_attr('sun.sun', 'next_rising')) -%}
            {%- set s = as_datetime(state_attr('sun.sun', 'next_setting')) -%}
            {%- set ns = namespace(hours='', count=0) -%}
            {#- The next 7 hours that haven't started yet. Weather integrations differ on whether
                the forecast begins with the current hour. -#}
            {%- for x in f -%}
              {%- set t = as_datetime(x.datetime) -%}
              {%- if t > now() and ns.count < 7 -%}
                {%- set day = (r <= t < s) if r < s else (t < s or t >= r) -%}
                {%- set ns.hours = ns.hours ~ ';' ~ as_local(t).hour ~ ',' ~ x.condition ~ ',' ~ (0 if day else 1) ~ ',' ~ (x.temperature | round(0) | int) -%}
                {%- set ns.count = ns.count + 1 -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set temps = f[:24] | map(attribute='temperature') | list -%}
            {#- The shown temperature only changes once the real one is a full degree away, so a
                value hovering near a rounding boundary doesn't redraw the screen on every wake. -#}
            {%- set raw = (states(outdoor) | float) if has_value(outdoor) else none -%}
            {%- set shown = states('input_text.note4c_screen').split('@')[-1].split('|')[0] | int(none) -%}
            {%- set outdoor_text = '?' if raw is none else (shown if shown is not none and (raw - shown) | abs < 1 else raw | round(0) | int) -%}
            {{ now().timestamp() | int }}@{{ outdoor_text }}|{{ states(weather) }}|{{ 1 if is_state('sun.sun', 'below_horizon') else 0 }}|{{ temps | max | round(0) | int }}|{{ temps | min | round(0) | int }}{{ ns.hours }}

  # The device reports the key of each notice dismissed with its buttons. The same key can arrive
  # again later, such as after the device was offline, and then there's nothing left to remove.
  - id: note4c_notice_dismissed
    alias: Note 4C notice dismissed
    description: Removes the notice dismissed on the Note 4C, including a mirrored HA notification.
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.note4c_dismissed_notice # The device's "Dismissed notice" sensor.
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.state not in ['', 'unknown', 'unavailable'] }}"
    actions:
      - variables:
          item: >-
            {{ (state_attr('sensor.note4c_notices', 'queue') or [])
               | selectattr('key', 'eq', trigger.to_state.state) | first | default(none) }}
      - condition: template
        value_template: "{{ item is not none }}"
      - event: note4c_notice_remove
        event_data:
          key: "{{ item.key }}"
      - if:
          - condition: template
            value_template: "{{ item.source == 'persistent' }}"
        then:
          - action: persistent_notification.dismiss
            data:
              notification_id: "{{ item.id }}"

  # Shows Home Assistant's own notifications too, when input_boolean.note4c_show_ha_notifications
  # is on. Dismissing one on either side removes it from both.
  - id: note4c_mirror_ha_notifications
    alias: Note 4C mirror HA notifications
    description: Copies Home Assistant notifications to the Note 4C.
    mode: queued
    triggers:
      - trigger: persistent_notification
        update_type: [added, updated]
        id: added
      - trigger: persistent_notification
        update_type: [removed]
        id: removed
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: added
              - condition: state
                entity_id: input_boolean.note4c_show_ha_notifications
                state: "on"
            sequence:
              - event: note4c_notice_add
                event_data:
                  id: "{{ trigger.notification.notification_id }}"
                  title: "{{ trigger.notification.title or 'Home Assistant' }}"
                  # Keeps a Markdown link's text and drops its address.
                  message: >-
                    {{ trigger.notification.message | regex_replace('\\[([^\\]]*)\\]\\([^)]*\\)', '\\1') }}
                  source: persistent
          - conditions:
              - condition: trigger
                id: removed
            sequence:
              - event: note4c_notice_remove
                event_data:
                  id: "{{ trigger.notification.notification_id }}"
