display:
  - platform: epaper_spi
    id: epaper
    model: jd79660
    dimensions:
      width: 400
      height: 300
    cs_pin: GPIO11
    dc_pin: GPIO10
    reset_pin: GPIO9
    busy_pin:
      number: GPIO8
      inverted: true # Low means busy on this panel.
    enable_pin: GPIO6
    data_rate: 10MHz
    # The driver has no separate power-on step, so power on (0x04) belongs here.
    init_sequence:
      - [0xE9, 0x01]
      - [0x04]
    update_interval: never
    # The layout matches design/preview.py and design/mockups.py, which draw the same screens.
    lambda: |-
      const Color black(0, 0, 0), white(255, 255, 255), red(255, 0, 0), yellow(255, 255, 0);

      // Splits on a separator, keeping empty fields.
      auto split = [](const std::string &text, char separator) {
        std::vector<std::string> parts;
        size_t start = 0;
        for (size_t end; (end = text.find(separator, start)) != std::string::npos; start = end + 1) {
          parts.push_back(text.substr(start, end - start));
        }
        parts.push_back(text.substr(start));
        return parts;
      };
      // Temperatures use a true minus sign and a degree sign.
      auto degrees = [](const std::string &value) {
        return (!value.empty() && value[0] == '-' ? std::string("−") + value.substr(1) : value) + "°";
      };
      auto is_condition = [](const std::string &value, std::initializer_list<const char *> names) {
        for (const char *name : names) {
          if (value == name) return true;
        }
        return false;
      };
      // A filled box with inclusive corners, as in the Python previews.
      auto box = [&](int x0, int y0, int x1, int y1, Color color) {
        it.filled_rectangle(x0, y0, x1 - x0 + 1, y1 - y0 + 1, color);
      };
      auto text_width = [&](font::Font *font, const std::string &text) {
        int x1, y1, width, height;
        it.get_text_bounds(0, 0, text.c_str(), font, TextAlign::BASELINE_LEFT, &x1, &y1, &width, &height);
        return width;
      };
      // Shortens text to fit, ending with an ellipsis. Drops whole words where it can.
      auto ellipsize = [&](std::string text, font::Font *font, int width) {
        while (!text.empty() && text_width(font, text + "…") > width) {
          const size_t space = text.rfind(' ');
          if (space != std::string::npos) {
            text.erase(space);
          } else {
            text.pop_back();
            while (!text.empty() && (text.back() & 0xC0) == 0x80) text.pop_back();  // Whole UTF-8 characters.
          }
        }
        return text + "…";
      };
      // Greedy word wrap. When the text doesn't fit, the last line ends with an ellipsis.
      auto wrap = [&](const std::string &text, font::Font *font, int width, size_t max_lines) {
        std::vector<std::string> lines;
        std::string line;
        bool overflow = false;
        for (const auto &word : split(text, ' ')) {
          if (word.empty()) continue;
          const std::string candidate = line.empty() ? word : line + " " + word;
          if (line.empty() || text_width(font, candidate) <= width) {
            line = candidate;
            continue;
          }
          lines.push_back(line);
          line = word;
          if (lines.size() == max_lines) {
            overflow = true;
            break;
          }
        }
        if (!overflow && !line.empty()) lines.push_back(line);
        for (size_t i = 0; i < lines.size(); i++) {
          const bool last = i + 1 == lines.size();
          if ((last && overflow) || text_width(font, lines[i]) > width) lines[i] = ellipsize(lines[i], font, width);
        }
        return lines;
      };
      // Battery outline with `level` of four bars filled. (x, y) is the top left.
      auto battery_icon = [&](int x, int y, int w, int h, int level, int line) {
        box(x, y, x + w, y + h, black);
        box(x + line, y + line, x + w - line, y + h - line, white);
        box(x + w + 1, y + h / 3, x + w + line + 1, y + h - h / 3, black);
        const int bar = (w - 2 * line - 2 - 3) / 4;
        for (int i = 0; i < level; i++) {
          const int bx = x + line + 1 + i * (bar + 1);
          box(bx, y + line + 1, bx + bar - 1, y + h - line - 1, red);
        }
      };
      // The round BOOT button, followed by a hint. (x, y) is the left end of the baseline.
      auto button_hint = [&](int x, int y, const char *text, Color color) {
        it.filled_circle(x + 5, y - 5, 5, color);
        it.filled_circle(x + 5, y - 5, 3, white);
        it.filled_circle(x + 5, y - 5, 2, color);
        it.print(x + 15, y, id(font_hint), color, TextAlign::BASELINE_LEFT, text);
      };

      it.fill(white);

      if (id(critical_screen)) {
        // A yellow dot screen says "not normal" from across the room, without the warning red.
        for (int y = 0; y < 300; y += 6) {
          for (int x = (y / 6) % 2 ? 3 : 0; x < 400; x += 6) box(x, y, x + 1, y + 1, yellow);
        }
        box(40, 40, 359, 259, black);
        box(43, 43, 356, 256, white);
        battery_icon(140, 70, 110, 52, 0, 6);
        box(152, 82, 164, 110, red);  // One thin sliver: nearly empty.
        it.print(200, 166, id(font_big_title), black, TextAlign::BASELINE_CENTER, "Naładuj baterię");
        it.print(200, 196, id(font_condition), black, TextAlign::BASELINE_CENTER, "Ekran się teraz nie odświeża.");
        it.print(200, 218, id(font_condition), black, TextAlign::BASELINE_CENTER, "Wróci sam po podłączeniu ładowarki.");
        const time_t data_time = strchr(rtc_last_data, '@') ? strtoul(rtc_last_data, nullptr, 10) : 0;
        if (data_time > 0) {
          const std::string when = ESPTime::from_epoch_local(data_time).strftime("%d.%m, %H:%M");
          it.print(200, 244, id(font_status), red, TextAlign::BASELINE_CENTER, ("Ostatnie dane: " + when).c_str());
        }
        return;
      }

      const auto sections = split(id(screen_data), ';');
      const auto now = split(sections[0], '|');
      if (now.size() < 5) return;
      const bool night_now = now[2] == "1";
      const auto notice = split(id(notice_shown), '|');
      const bool has_notice = notice.size() >= 5;
      const int notice_count = has_notice ? atoi(notice[1].c_str()) : 0;
      const std::string counter = notice_count > 1 ? "1/" + notice[1] : "";

      if (has_notice && notice[2] == "1") {
        // A priority notice takes the whole screen. The temperature moves to the footer.
        box(0, 0, 399, 47, red);
        it.print(18, 31, id(font_header), white, TextAlign::BASELINE_LEFT, "Powiadomienie");
        it.print(382, 31, id(font_header), white, TextAlign::BASELINE_RIGHT, counter.c_str());
        int y = 88;
        for (const auto &line : wrap(notice[3], id(font_big_title), 364, 2)) {
          it.print(18, y, id(font_big_title), black, TextAlign::BASELINE_LEFT, line.c_str());
          y += 32;
        }
        y += 6;
        // As many body lines as fit above the footer: 6 after a one-line title, 5 after two.
        for (const auto &line : wrap(notice[4], id(font_big_body), 364, (258 - y) / 25 + 1)) {
          it.print(18, y, id(font_big_body), black, TextAlign::BASELINE_LEFT, line.c_str());
          y += 25;
        }
        box(0, 264, 399, 265, black);
        button_hint(18, 288, "przytrzymaj, aby odrzucić", black);
        if (!id(screen_status).empty()) {
          it.print(382, 288, id(font_status), red, TextAlign::BASELINE_RIGHT, id(screen_status).c_str());
        } else {
          it.print(382, 288, id(font_status), black, TextAlign::BASELINE_RIGHT, ("${sensor_label} " + degrees(now[0])).c_str());
        }
        return;
      }

      auto hero_for = [&](const std::string &c, bool night) -> image::Image * {
        if (c == "clear-night" || (c == "sunny" && night)) return id(hero_clear_night);
        if (c == "sunny") return id(hero_sunny);
        if (c == "partlycloudy") return night ? id(hero_partly_night) : id(hero_partly);
        if (c == "cloudy") return id(hero_cloudy);
        if (c == "rainy") return id(hero_rainy);
        if (c == "pouring") return id(hero_pouring);
        if (is_condition(c, {"snowy", "hail"})) return id(hero_snowy);
        if (c == "snowy-rainy") return id(hero_sleet);
        if (c == "fog") return night ? id(hero_foggy_night) : id(hero_foggy);
        if (c == "lightning") return id(hero_stormy);
        if (c == "lightning-rainy") return id(hero_storm_rain);
        if (is_condition(c, {"windy", "windy-variant"})) return id(hero_windy);
        return id(hero_cloudy);
      };
      auto icon_for = [&](const std::string &c, bool night) -> image::Image * {
        if (c == "clear-night" || (c == "sunny" && night)) return id(icon_moon);
        if (c == "sunny") return id(icon_sun);
        if (c == "partlycloudy") return night ? id(icon_partly_moon) : id(icon_partly);
        if (c == "cloudy") return id(icon_cloud);
        if (c == "rainy") return id(icon_rain);
        if (c == "pouring") return id(icon_pour);
        if (is_condition(c, {"snowy", "hail"})) return id(icon_snow);
        if (c == "snowy-rainy") return id(icon_sleet);
        if (c == "fog") return night ? id(icon_fog_moon) : id(icon_fog);
        if (is_condition(c, {"lightning", "lightning-rainy"})) return id(icon_storm);
        if (is_condition(c, {"windy", "windy-variant"})) return id(icon_wind);
        return id(icon_cloud);
      };
      // Condition names in Polish, split over the text column's two lines.
      auto text_for = [&](const std::string &c) -> std::pair<const char *, const char *> {
        if (c == "clear-night" || c == "sunny") return {"Bezchmurnie", ""};
        if (c == "partlycloudy") return {"Częściowe", "zachmurzenie"};
        if (c == "cloudy") return {"Pochmurno", ""};
        if (c == "rainy") return {"Deszcz", ""};
        if (c == "pouring") return {"Ulewa", ""};
        if (c == "snowy") return {"Śnieg", ""};
        if (c == "snowy-rainy") return {"Deszcz", "ze śniegiem"};
        if (c == "hail") return {"Grad", ""};
        if (c == "fog") return {"Mgła", ""};
        if (c == "lightning") return {"Burza", ""};
        if (c == "lightning-rainy") return {"Burza", "z deszczem"};
        if (is_condition(c, {"windy", "windy-variant"})) return {"Wietrznie", ""};
        return {c.c_str(), ""};
      };

      it.image(190, 0, hero_for(now[1], night_now));
      it.print(22, 36, id(font_label), black, TextAlign::BASELINE_LEFT, "${sensor_label}");
      it.print(18, 106, id(font_temp), black, TextAlign::BASELINE_LEFT, degrees(now[0]).c_str());
      const auto words = text_for(now[1]);
      it.print(22, 136, id(font_condition), black, TextAlign::BASELINE_LEFT, words.first);
      it.print(22, 157, id(font_condition), black, TextAlign::BASELINE_LEFT, words.second);
      it.print(22, 184, id(font_range), red, TextAlign::BASELINE_LEFT, (degrees(now[3]) + " / " + degrees(now[4])).c_str());

      if (has_notice) {
        // The notice card takes the place of the hourly forecast.
        box(8, 200, 391, 296, black);
        box(10, 202, 389, 294, white);
        box(10, 202, 15, 294, red);
        it.print(380, 221, id(font_status), red, TextAlign::BASELINE_RIGHT, counter.c_str());
        const auto title = wrap(notice[3], id(font_notice_title), 330, 1);
        if (!title.empty()) it.print(25, 221, id(font_notice_title), black, TextAlign::BASELINE_LEFT, title[0].c_str());
        int y = 243;
        for (const auto &line : wrap(notice[4], id(font_notice_body), 352, 2)) {
          it.print(25, y, id(font_notice_body), black, TextAlign::BASELINE_LEFT, line.c_str());
          y += 20;
        }
        button_hint(25, 287, "przytrzymaj, aby odrzucić", red);
      } else {
        // The first column shows the current conditions, followed by upcoming hours.
        const int columns = 8;
        const auto column_x = [&](int i) { return 400 * i / columns + 200 / columns; };
        it.print(column_x(0), 216, id(font_now), red, TextAlign::BASELINE_CENTER, "teraz");
        it.image(column_x(0) - 20, 218, icon_for(now[1], night_now));
        it.print(column_x(0), 280, id(font_hour_temp), black, TextAlign::BASELINE_CENTER, degrees(now[0]).c_str());
        for (int i = 1; i < columns && i < (int) sections.size(); i++) {
          const auto hour = split(sections[i], ',');
          if (hour.size() < 4) continue;
          const int x = column_x(i);
          it.print(x, 216, id(font_hour), black, TextAlign::BASELINE_CENTER, hour[0].c_str());
          it.image(x - 20, 218, icon_for(hour[1], hour[2] == "1"));
          it.print(x, 280, id(font_hour_temp), black, TextAlign::BASELINE_CENTER, degrees(hour[3]).c_str());
        }
      }

      if (!id(screen_status).empty()) {
        box(196, 166, 393, 191, red);
        box(198, 168, 391, 189, white);
        if (id(status_battery)) {
          // The icon goes before the text, and the two are centred together.
          const int x = 295 - (30 + text_width(id(font_status), id(screen_status))) / 2;
          battery_icon(x, 173, 20, 11, 1, 2);
          it.print(x + 30, 184, id(font_status), red, TextAlign::BASELINE_LEFT, id(screen_status).c_str());
        } else {
          it.print(295, 184, id(font_status), red, TextAlign::BASELINE_CENTER, id(screen_status).c_str());
        }
      }
