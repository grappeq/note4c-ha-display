# Zectrix Note 4C on ESPHome: garden temperature, hourly forecast and notices, on battery.
#
# Each wake: connect to Home Assistant, read the screen data and the current notice, redraw only if
# something changed, then sleep. The panel's SSD2683 uses the same command set and colour codes as
# ESPHome's JD79660 driver, so only the init sequence differs.
#
# The data comes from a text helper and a notice queue, which homeassistant/note4c_screen.yaml keeps
# up to date. Screen text is in Polish: see text_for, the "teraz" label and the other strings below.
#
# Buttons: a short BOOT press wakes and refreshes. Holding BOOT dismisses the notice on screen; a
# beep says it was held long enough. UP dismisses with a single press while the device is awake
# (it can't wake the board, as GPIO39 isn't an RTC pin). The green LED confirms each press.
#
# To update firmware: press BOOT on the device, which keeps it awake for 3 minutes, then press
# Install in Device Builder. Device Builder shows the sleeping device as online, so Install on its
# own tries to send straight away and usually fails.
substitutions:
  sleep_time: 15min
  fw_version: 1.3.0
  sensor_label: Ogródek # The name above the temperature.
  screen_helper: input_text.note4c_screen
  notice_entity: sensor.note4c_notices
  stale_after: "3600" # Warn when the data is older than this many seconds.
  offline_wakes: "8" # Warn after this many wakes in a row without Home Assistant.
  # Battery levels in percent. The warning shows at low_battery, and both the warning and the
  # critical screen clear at battery_ok or when charging. At critical_battery the device shows a
  # "charge me" screen and stops its timed wakes until BOOT is pressed or a charger is connected.
  low_battery: "15"
  battery_ok: "20"
  critical_battery: "5"
  long_press: 1200ms # How long to hold BOOT to dismiss a notice.
  beep_volume: 50%
  # Every character a notice can contain. Home Assistant removes anything else before sending, so
  # keep this in step with "allowed" in homeassistant/note4c_screen.yaml.
  text_glyphs: >-
    abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZąćęłńóśźżĄĆĘŁŃÓŚŹŻ 0123456789.,:;!?-–()%/"'+°−…·

esphome:
  name: note4c
  includes:
    - rtc_state.h
  project:
    name: zectrix.note4c
    version: ${fw_version}
  on_boot:
    - priority: 1000
      then:
        # GPIO17 keeps the board powered on battery, so it's driven high before its hold from the
        # last sleep is released. GPIO6 (panel power) is held low during sleep, as are the LED,
        # the speaker amplifier and the audio power.
        # GPIO42 powers the audio codec, which must be on before the codec is set up.
        - lambda: |-
            gpio_set_level(GPIO_NUM_17, 1);
            gpio_set_direction(GPIO_NUM_17, GPIO_MODE_OUTPUT);
            gpio_hold_dis(GPIO_NUM_17);
            gpio_hold_dis(GPIO_NUM_6);
            gpio_hold_dis(GPIO_NUM_0);
            gpio_hold_dis(GPIO_NUM_3);
            gpio_hold_dis(GPIO_NUM_46);
            gpio_set_level(GPIO_NUM_42, 1);
            gpio_set_direction(GPIO_NUM_42, GPIO_MODE_OUTPUT);
            gpio_hold_dis(GPIO_NUM_42);
    - priority: 790 # Just after the LED output is set up, and well before Wi-Fi.
      then:
        - lambda: id(button_wake) = esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_EXT0;
        - if:
            condition:
              lambda: return id(button_wake);
            then:
              - script.execute: led_ack
    - priority: 600
      then:
        # Held while awake too, so a firmware update or a crash can't drop power during the reset.
        - lambda: gpio_hold_en(GPIO_NUM_17);
    - priority: -100
      then:
        # Home Assistant gets this on every connection, so a dismissal made offline still arrives.
        - lambda: id(dismissed_notice).publish_state(rtc_dismissed_notice);
        - script.execute: sleep_watchdog
        - script.execute: wake_cycle

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: !secret note4c_address

api:
  id: api_id
  encryption:
    key: !secret note4c_api_key
  # The default reboots after 15 minutes without a client, which is normal for a sleeping device.
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption: {} # Uses the API encryption key.

# New firmware is confirmed only once it has read the screen data from Home Assistant (see
# wake_cycle), never just by booting or sleeping. Otherwise the bootloader rolls it back on the next
# start, so an update installed with the wrong helper name is undone.
safe_mode:
  boot_is_good_after: 5min
  boot_is_good_on_shutdown: false
  storage: rtc # A flash write on every wake would add up.

time:
  - platform: homeassistant
    id: ha_time

# The speaker: an ES8311 codec on I2C and I2S, followed by an amplifier switched by GPIO46.
i2c:
  sda: GPIO47
  scl: GPIO48
  scan: false

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO38
    i2s_bclk_pin: GPIO15
    i2s_mclk_pin: GPIO14

audio_dac:
  - platform: es8311
    id: codec

speaker:
  - platform: i2s_audio
    id: speaker_out
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO45
    dac_type: external
    audio_dac: codec
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono

rtttl:
  id: beeper
  speaker: speaker_out
  gain: ${beep_volume}
  on_finished_playback:
    - output.turn_off: speaker_amp

output:
  # The green LED is lit when GPIO3 is low.
  - platform: gpio
    id: led
    pin:
      number: GPIO3
      inverted: true
      ignore_strapping_warning: true
  - platform: gpio
    id: speaker_amp
    pin:
      number: GPIO46
      ignore_strapping_warning: true

sensor:
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 5s
  # The battery is behind a 2:1 divider. It's read once per wake (see wake_cycle).
  - platform: adc
    id: battery_voltage
    name: Battery voltage
    pin: GPIO4
    attenuation: 12db
    samples: 10
    update_interval: never
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    filters:
      - multiply: 2.0
  # The percentage uses the same curve as the vendor's reference firmware.
  - platform: copy
    id: battery_percent
    source_id: battery_voltage
    name: Battery
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      - lambda: |-
          const float mv = x * 1000.0f;
          return clamp((-mv * mv + 9016.0f * mv - 19189000.0f) / 10000.0f, 0.0f, 100.0f);

binary_sensor:
  - platform: gpio
    id: charging
    name: Charging
    device_class: battery_charging
    entity_category: diagnostic
    pin:
      number: GPIO2
      inverted: true
  # Presses while awake. A press that woke the device is handled in wake_cycle instead, because
  # these only report changes after they're set up.
  - platform: gpio
    id: boot_button
    internal: true
    pin:
      number: GPIO0
      inverted: true
      mode: INPUT_PULLUP
      ignore_strapping_warning: true
      allow_other_uses: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      - script.execute: hold_timer
    on_release:
      - if:
          condition:
            script.is_running: hold_timer
          then:
            - script.stop: hold_timer
            - script.execute: short_press
  - platform: gpio
    id: up_button
    internal: true
    pin:
      number: GPIO39
      inverted: true
      mode: INPUT_PULLUP
    filters:
      - delayed_on_off: 20ms
    on_press:
      - script.execute: led_ack
      - script.execute: dismiss_notice

text_sensor:
  - platform: homeassistant
    id: screen_source
    entity_id: ${screen_helper}
    internal: true
  # "key|count|priority|title|message", or empty when there's no notice.
  - platform: homeassistant
    id: notice_source
    entity_id: ${notice_entity}
    attribute: screen
    internal: true
  # The key of the last notice dismissed on the device. Home Assistant removes that notice.
  - platform: template
    id: dismissed_notice
    name: Dismissed notice
    entity_category: diagnostic
    icon: mdi:bell-check
    update_interval: never

deep_sleep:
  id: sleeper
  sleep_duration: ${sleep_time}
  wakeup_pin:
    number: GPIO0
    inverted: true
    mode: INPUT_PULLUP
    ignore_strapping_warning: true
    allow_other_uses: true

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO13

switch:
  # Must stay high or the board switches off when running on battery.
  - platform: gpio
    id: power_hold
    pin: GPIO17
    restore_mode: ALWAYS_ON
    internal: true

globals:
  # The helper's value: "timestamp@temp|condition|night|high|low;hour,condition,night,temp;..."
  # The timestamp is optional, and without it the data's age can't be checked.
  - id: raw_data
    type: std::string
  # The same value without the timestamp.
  - id: screen_data
    type: std::string
  # A short warning for the screen, or empty when all is well.
  - id: screen_status
    type: std::string
  - id: status_battery # Shows the battery icon in the warning box.
    type: bool
    initial_value: "false"
  # The latest notice from Home Assistant, and the one to draw, which leaves out a dismissed notice
  # that Home Assistant hasn't removed yet.
  - id: notice_data
    type: std::string
  - id: notice_shown
    type: std::string
  - id: critical_screen
    type: bool
    initial_value: "false"
  # Everything that decides what the screen shows, so a change can be detected.
  - id: screen_key
    type: std::string
  - id: ha_offline
    type: bool
    initial_value: "false"
  - id: button_wake # Woken by BOOT, as opposed to the timer, a reset or the charger.
    type: bool
    initial_value: "false"
  - id: dismiss_at_wake # BOOT was held while waking.
    type: bool
    initial_value: "false"
  - id: dismiss_confirmed
    type: bool
    initial_value: "false"
  - id: quick_sleep # Skips the 3-minute window after a manual wake.
    type: bool
    initial_value: "false"
  # Stored in flash so a sleep, crash or power loss doesn't force a redraw. Only changes when the
  # screen does, so flash wear isn't a concern.
  - id: shown_hash
    type: uint32_t
    restore_value: true
    initial_value: "0"

script:
  - id: go_to_sleep
    then:
      # Any boot other than a scheduled wake (BOOT pressed, power-on, a fresh install) stays awake
      # for a while, so there's a dependable window for Device Builder and for debugging. A wake
      # just to dismiss a notice doesn't need it.
      - if:
          condition:
            lambda: return esp_sleep_get_wakeup_cause() != ESP_SLEEP_WAKEUP_TIMER && !id(quick_sleep);
          then:
            - logger.log: staying awake for updates
            - delay: 3min
      # A redraw started by a button press finishes first.
      - wait_until:
          condition:
            not:
              script.is_running: redraw_if_changed
          timeout: 60s
      - lambda: |-
          // Keeps the board powered through deep sleep. The panel doesn't need power to hold its
          // image, and the LED, amplifier and codec are switched off.
          gpio_set_level(GPIO_NUM_6, 0);
          gpio_hold_en(GPIO_NUM_6);
          gpio_set_level(GPIO_NUM_3, 1);
          gpio_hold_en(GPIO_NUM_3);
          gpio_set_level(GPIO_NUM_46, 0);
          gpio_hold_en(GPIO_NUM_46);
          gpio_set_level(GPIO_NUM_42, 0);
          gpio_hold_en(GPIO_NUM_42);
          gpio_hold_en(GPIO_NUM_17);
          gpio_deep_sleep_hold_en();
          if (rtc_critical_battery) {
            // No more timed wakes worth the name: about 49 days. BOOT still wakes the device, and
            // so does connecting a charger, which pulls CHRG_L (GPIO2) low.
            id(sleeper)->set_sleep_duration(UINT32_MAX);
            id(sleeper)->set_ext1_wakeup({1ULL << GPIO_NUM_2, ESP_EXT1_WAKEUP_ANY_LOW});
          }
      - deep_sleep.enter: sleeper

  # Whatever goes wrong during a wake, the device must not stay awake and drain the battery.
  - id: sleep_watchdog
    then:
      - delay: 100s
      - logger.log: wake took too long, going to sleep
      - script.execute: go_to_sleep

  - id: wake_cycle
    then:
      - component.update: battery_voltage
      - lambda: |-
          // Separate on and off levels stop a level near a limit from causing repeated redraws.
          const float battery = id(battery_percent).state;
          if (id(charging).state || battery >= ${battery_ok}) {
            rtc_low_battery = false;
            rtc_critical_battery = false;
          } else {
            if (battery <= ${low_battery}) rtc_low_battery = true;
            if (battery <= ${critical_battery}) rtc_critical_battery = true;
          }
      - if:
          condition:
            lambda: return rtc_critical_battery;
          then:
            - script.execute: show_battery_critical
            - script.stop: wake_cycle
      # BOOT still held about a second after waking means a long press. The press began before the
      # chip started, so this is close to the long_press time used while awake.
      - if:
          condition:
            lambda: return id(button_wake) && gpio_get_level(GPIO_NUM_0) == 0;
          then:
            - wait_until:
                condition:
                  lambda: return gpio_get_level(GPIO_NUM_0) == 1;
                timeout: !lambda "return millis() < 1000 ? 1000 - millis() : 0;"
            - if:
                condition:
                  lambda: return gpio_get_level(GPIO_NUM_0) == 0;
                then:
                  - lambda: id(dismiss_at_wake) = true;
                  - script.execute: long_press_feedback
      - if:
          condition:
            lambda: return id(button_wake);
          then:
            - script.execute: led_busy
      # A manual wake stays awake for longer, so it also waits longer, such as while the device is
      # being added to Home Assistant.
      - wait_until:
          condition:
            api.connected:
          timeout: !lambda |-
            return esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_TIMER ? 40000 : 170000;
      - if:
          condition:
            not:
              api.connected:
          then:
            - lambda: |-
                rtc_failed_wakes++;
                ESP_LOGW("app", "Home Assistant didn't connect, %u wakes in a row", (unsigned) rtc_failed_wakes);
            - if:
                condition:
                  lambda: return id(button_wake);
                then:
                  - script.execute: led_fail
            - if:
                condition:
                  lambda: return rtc_failed_wakes >= ${offline_wakes} && rtc_last_data[0] != 0;
                then:
                  - lambda: |-
                      id(ha_offline) = true;
                      id(raw_data) = rtc_last_data;
                      id(notice_data) = rtc_last_notice;
                  - script.execute: prepare_screen
                  - script.execute: redraw_if_changed
                  - script.wait: redraw_if_changed
                  - script.execute: finish_wake
                else:
                  - script.execute: go_to_sleep
            - script.stop: wake_cycle
      - lambda: rtc_failed_wakes = 0;
      - wait_until:
          condition:
            lambda: return id(screen_source).has_state();
          timeout: 10s
      # Home Assistant sends all the values together, so the notice is normally already here.
      - wait_until:
          condition:
            lambda: return id(notice_source).has_state();
          timeout: 2s
      # The stale data check needs the clock, which Home Assistant sets on connecting.
      - wait_until:
          condition:
            lambda: return id(ha_time).now().is_valid();
          timeout: 3s
      - script.execute: read_from_ha
      - if:
          condition:
            lambda: return !id(raw_data).empty();
          then:
            - safe_mode.mark_successful:
            - if:
                condition:
                  lambda: return id(dismiss_at_wake) && rtc_shown_notice[0] != 0;
                then:
                  # The LED and the redraw are handled by dismiss_notice.
                  - lambda: id(quick_sleep) = true;
                  - script.execute: dismiss_notice
                  - script.wait: dismiss_notice
                else:
                  - script.execute: prepare_screen
                  - script.execute: redraw_if_changed
                  - script.wait: redraw_if_changed
                  - if:
                      condition:
                        lambda: return id(button_wake);
                      then:
                        - script.execute: led_done
            - script.execute: finish_wake
          else:
            - logger.log: no valid screen data from Home Assistant
            - if:
                condition:
                  lambda: return id(button_wake);
                then:
                  - script.execute: led_fail
            - script.execute: go_to_sleep

  # Copies the latest values from Home Assistant. Placeholders such as "unknown" must not replace a
  # good screen: valid data has at least 4 field separators.
  - id: read_from_ha
    then:
      - lambda: |-
          auto valid = [](const std::string &s) { return std::count(s.begin(), s.end(), '|') >= 4; };
          if (id(screen_source).has_state() && valid(id(screen_source).state)) {
            id(raw_data) = id(screen_source).state;
            strncpy(rtc_last_data, id(raw_data).c_str(), sizeof(rtc_last_data) - 1);
            rtc_last_data[sizeof(rtc_last_data) - 1] = 0;
            ESP_LOGI("app", "screen data: %s", id(raw_data).c_str());
          }
          if (id(notice_source).has_state()) {
            const std::string &notice = id(notice_source).state;
            id(notice_data) = valid(notice) && notice.size() < sizeof(rtc_last_notice) ? notice : "";
            strncpy(rtc_last_notice, id(notice_data).c_str(), sizeof(rtc_last_notice) - 1);
            rtc_last_notice[sizeof(rtc_last_notice) - 1] = 0;
            ESP_LOGI("app", "notice: %s", id(notice_data).c_str());
          }

  # Splits off the timestamp, decides whether the screen needs a warning, and picks the notice.
  - id: prepare_screen
    then:
      - lambda: |-
          const std::string &raw = id(raw_data);
          const size_t at = raw.find('@');
          const time_t data_time = at == std::string::npos ? 0 : strtoul(raw.c_str(), nullptr, 10);
          id(screen_data) = at == std::string::npos ? raw : raw.substr(at + 1);

          std::string data_warning;
          if (id(ha_offline)) {
            data_warning = "Brak połączenia";
          } else {
            const auto now = id(ha_time).now();
            if (data_time > 0 && now.is_valid() && now.timestamp > data_time + ${stale_after}) {
              data_warning = "Dane z " + ESPTime::from_epoch_local(data_time).strftime("%H:%M");
            }
          }
          // With both, the icon says "battery" and the text gives the data warning.
          id(status_battery) = rtc_low_battery;
          id(screen_status) = rtc_low_battery && data_warning.empty() ? "Naładuj baterię" : data_warning;

          const std::string &notice = id(notice_data);
          const std::string key = notice.substr(0, notice.find('|'));
          id(notice_shown) = !notice.empty() && key != rtc_dismissed_notice ? notice : "";

          id(critical_screen) = false;
          id(screen_key) = id(screen_data) + "#" + id(screen_status) + (id(status_battery) ? "#b#" : "##") + id(notice_shown);

  - id: show_battery_critical
    then:
      - logger.log: battery critical, stopping timed wakes
      - lambda: |-
          id(critical_screen) = true;
          id(notice_shown) = "";
          id(screen_key) = "critical";
          id(quick_sleep) = true;
      - script.execute: redraw_if_changed
      - script.wait: redraw_if_changed
      - if:
          condition:
            lambda: return id(button_wake);
          then:
            - script.execute: led_fail
            - delay: 1s
      - script.execute: finish_wake

  - id: redraw_if_changed
    then:
      - if:
          condition:
            lambda: return fnv1_hash(id(screen_key)) != id(shown_hash);
          then:
            - component.update: epaper
            - wait_until:
                condition:
                  not:
                    epaper_spi.is_updating: epaper
                timeout: 60s
            - lambda: |-
                if (id(epaper).is_failed() || id(epaper).is_updating()) {
                  ESP_LOGE("app", "redraw failed, will retry on the next wake");
                  return;
                }
                id(shown_hash) = fnv1_hash(id(screen_key));
                const std::string &notice = id(notice_shown);
                const std::string key = notice.substr(0, notice.find('|'));
                strncpy(rtc_shown_notice, key.c_str(), sizeof(rtc_shown_notice) - 1);
                rtc_shown_notice[sizeof(rtc_shown_notice) - 1] = 0;
                ESP_LOGI("app", "screen updated");
          else:
            - logger.log: nothing to redraw

  # Gives Home Assistant a moment to receive current sensor values, and the new hash time to reach
  # the preferences before they're written.
  - id: finish_wake
    then:
      - delay: 2s
      - lambda: global_preferences->sync();
      - script.execute: go_to_sleep

  # Reports the notice on screen as dismissed, then waits briefly for Home Assistant to move on to
  # the next one. If it doesn't answer, the notice is hidden here and Home Assistant removes it when
  # it next receives the dismissal.
  - id: dismiss_notice
    then:
      - if:
          condition:
            lambda: return rtc_shown_notice[0] == 0;
          then:
            - logger.log: no notice to dismiss
            - script.stop: dismiss_notice
      - script.execute: led_busy
      - lambda: |-
          strncpy(rtc_dismissed_notice, rtc_shown_notice, sizeof(rtc_dismissed_notice));
          id(dismissed_notice).publish_state(rtc_dismissed_notice);
          ESP_LOGI("app", "dismissed notice %s", rtc_dismissed_notice);
      - wait_until:
          condition:
            api.connected:
          timeout: 40s
      - wait_until:
          condition:
            lambda: |-
              if (!id(api_id).is_connected() || !id(notice_source).has_state()) return false;
              const std::string &notice = id(notice_source).state;
              return notice.substr(0, notice.find('|')) != rtc_dismissed_notice;
          timeout: 8s
      - lambda: |-
          const std::string &notice = id(notice_source).state;
          id(dismiss_confirmed) = id(api_id).is_connected() && id(notice_source).has_state() &&
                                  notice.substr(0, notice.find('|')) != rtc_dismissed_notice;
      - script.execute: read_from_ha
      - script.execute: prepare_screen
      - script.execute: redraw_if_changed
      - script.wait: redraw_if_changed
      - if:
          condition:
            lambda: return id(dismiss_confirmed);
          then:
            - script.execute: led_done
          else:
            - script.execute: led_fail

  # A short BOOT press while awake redraws with the latest data.
  - id: short_press
    then:
      - script.execute: led_ack
      - if:
          condition:
            or:
              - script.is_running: wake_cycle
              - script.is_running: dismiss_notice
              - script.is_running: refresh_now
          then:
            - logger.log: busy, press ignored
          else:
            - script.execute: refresh_now

  - id: refresh_now
    then:
      - script.execute: led_busy
      - script.execute: read_from_ha
      - script.execute: prepare_screen
      - script.execute: redraw_if_changed
      - script.wait: redraw_if_changed
      - if:
          condition:
            api.connected:
          then:
            - script.execute: led_done
          else:
            - script.execute: led_fail

  - id: hold_timer
    mode: restart
    then:
      - delay: ${long_press}
      - script.execute: long_press_feedback
      - if:
          condition:
            or:
              - script.is_running: wake_cycle
              - script.is_running: dismiss_notice
          then:
            - logger.log: busy, press ignored
          else:
            - script.execute: dismiss_notice

  # Tells you the button has been held long enough, so you can let go.
  - id: long_press_feedback
    then:
      - script.execute: led_armed
      - output.turn_on: speaker_amp
      - rtttl.play: "held:d=16,o=6,b=200:e,a"

  # LED patterns. Any pattern stops the "working" tick first.
  - id: led_ack # Got the press.
    mode: restart
    then:
      - output.turn_on: led
      - delay: 100ms
      - output.turn_off: led
  - id: led_armed # Held long enough: a double blink.
    mode: restart
    then:
      - script.stop: led_busy
      - repeat:
          count: 2
          then:
            - output.turn_on: led
            - delay: 70ms
            - output.turn_off: led
            - delay: 90ms
      - script.execute: led_busy
  - id: led_busy # Working: a short tick every 2 seconds.
    mode: restart
    then:
      - delay: 600ms # Keeps the first flash on its own.
      - while:
          condition:
            lambda: return true;
          then:
            - output.turn_on: led
            - delay: 60ms
            - output.turn_off: led
            - delay: 1940ms
  - id: led_done # Done: one long glow.
    mode: restart
    then:
      - script.stop: led_busy
      - output.turn_on: led
      - delay: 750ms
      - output.turn_off: led
  - id: led_fail # Couldn't reach Home Assistant, or the battery is critical: five fast flashes.
    mode: restart
    then:
      - script.stop: led_busy
      - repeat:
          count: 5
          then:
            - output.turn_on: led
            - delay: 80ms
            - output.turn_off: led
            - delay: 120ms

