# Copy to secrets.yaml and fill in. In Device Builder, add these to its Secrets instead.
wifi_ssid: "your-2.4ghz-network"
wifi_password: "your-password"

# 32 random bytes in base64, for example: openssl rand -base64 32
note4c_api_key: "replace-with-your-own-key"

# The device's IP address. Reserve it in your router so it doesn't change.
note4c_address: "192.0.2.10"
